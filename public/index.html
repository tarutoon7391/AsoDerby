<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ブロック馬 競馬プロトタイプ</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ブロック馬">
<meta name="theme-color" content="#5e3d22">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#9cc8ee}
#app{position:fixed;inset:0;background:#9cc8ee}
/* PC・タブレットではスマホと同じ縦長の画面を中央に置く。transformを付けると中のfixed要素が#app基準になる */
@media (min-width:640px){
  body{background:#24401f;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 28px),radial-gradient(ellipse at 50% 0%,#3d6b36,#1f3a1b 70%)}
  #app{left:50%;width:min(560px,100vw);transform:translateX(-50%);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 60px rgba(0,0,0,.55);overflow:hidden}
}
html,body{font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;touch-action:manipulation;-webkit-user-select:none;user-select:none}
canvas{display:block}
#hud{position:fixed;left:8px;top:8px;background:rgba(10,20,30,.72);color:#fff;border-radius:10px;padding:7px 10px;font-size:12px;min-width:150px;pointer-events:none}
#hud .row{display:flex;gap:5px;align-items:center;line-height:1.32;white-space:nowrap;font-size:11px}
#hud .num{width:15px;height:15px;line-height:15px;font-size:10px}
#hud .pos{width:14px;text-align:right;opacity:.75}
.num{display:inline-block;width:17px;height:17px;border-radius:4px;text-align:center;font-weight:800;font-size:11px;line-height:17px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
#info{position:fixed;right:8px;top:8px;background:rgba(10,20,30,.72);color:#fff;border-radius:10px;padding:7px 12px;font-size:12px;text-align:right;pointer-events:none;line-height:1.4}
#info b{font-size:20px}
#bar .hostop{display:none;width:100%;text-align:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.vsguest #bar .hostop{display:block}
.vsguest #bar .cam,.vsguest #skipStr,.vsguest #distCamBtn,.vsguest #spdBtn{opacity:.45;pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 8px calc(10px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:linear-gradient(transparent,rgba(0,0,0,.55))}
button{border:0;border-radius:8px;padding:9px 11px;font-size:13px;font-weight:700;background:rgba(255,255,255,.9);color:#123;cursor:pointer;font-family:inherit}
button.on{background:#ffcc33}
button.main{background:#2ecc71;color:#fff}
#center{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);color:#fff;font-size:46px;font-weight:900;text-shadow:0 3px 14px rgba(0,0,0,.65);pointer-events:none;text-align:center;white-space:nowrap}
#result{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(10,20,30,.92);color:#fff;border-radius:14px;padding:14px 18px;font-size:14px;display:none;min-width:230px}
#result h2{margin:0 0 8px;font-size:17px}
#result .row{display:flex;gap:8px;align-items:center;line-height:1.75}
#result .t{margin-left:auto;opacity:.8;font-variant-numeric:tabular-nums}
#bar button{padding:8px 10px}
.sheet{display:none;position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:rgba(8,16,26,.94);color:#fff;padding:10px 10px calc(16px + env(safe-area-inset-bottom));box-sizing:border-box;font-size:13px;z-index:10;-webkit-user-select:none}
.sheet .hd{display:flex;align-items:baseline;gap:8px;font-size:14px;margin-bottom:8px}
.sheet .hd b{font-size:17px}
.sheet .money{margin-left:auto;font-weight:700;color:#ffd66b}
.sheet .tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.sheet .tabs button{padding:8px 0;font-size:12px}
.sheet .hint{margin:8px 2px 6px;opacity:.75;font-size:12px}
.sheet table{width:100%;border-collapse:collapse}
.sheet th{font-size:11px;font-weight:600;opacity:.6;text-align:left;padding:3px 4px}
.sheet td{padding:5px 4px;border-top:1px solid rgba(255,255,255,.08)}
.sheet .list tr{cursor:pointer}
.sheet .list tr.on td{background:rgba(255,204,51,.22)}
.sheet .nm small{display:block;font-size:10px;opacity:.6}
.sheet .c{text-align:center}
.sheet .o{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.sheet .mk{width:34px;text-align:center;color:#ffcc33;font-weight:800;font-size:12px}
.sheet .pick{margin-top:10px;padding:10px;border-radius:10px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;gap:8px}
.sheet .od{margin-left:8px;opacity:.85}
.sheet .od b{color:#ffcc33;font-size:16px}
.sheet .amt{display:flex;align-items:center;gap:6px}
.sheet .amt b{min-width:80px;text-align:center;font-size:15px}
.sheet .amt button{padding:7px 10px}
.sheet button:disabled{opacity:.4}
.sheet .slip{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.sheet .sl{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:8px;background:rgba(255,255,255,.06)}
.sheet .sl .r{margin-left:auto;font-weight:700}
.sheet .sl button{padding:3px 9px}
.sheet .sl.hit{background:rgba(46,204,113,.25)}
.sheet .sl.miss{opacity:.6}
.sheet .empty{opacity:.55;font-size:12px;padding:6px 2px}
.sheet .ft{margin-top:12px;display:flex;align-items:center;gap:10px}
.sheet .ft button{margin-left:auto;padding:11px 16px;font-size:14px}
.sheet .refill{margin-top:10px;width:100%}
.sheet .podium{display:flex;flex-direction:column;gap:6px;font-size:15px;margin-bottom:10px}
.sheet .podium small{margin-left:8px;opacity:.6;font-size:11px}
.sheet .pay td.r{text-align:right;font-weight:700}
#focus{display:none;position:fixed;left:8px;top:8px;align-items:center;gap:7px;background:rgba(10,20,30,.75);color:#fff;border-radius:10px;padding:6px 10px;font-size:12px;pointer-events:none}
#focus b{font-size:14px}
.arw{display:inline-block;font-weight:900;font-size:14px;line-height:1;text-shadow:0 0 1px rgba(0,0,0,.4)}
#bet{display:none;position:fixed;left:0;right:0;bottom:0;top:42%;flex-direction:column;background:#0d1824;color:#fff;font-size:13px;z-index:10;box-shadow:0 -6px 20px rgba(0,0,0,.4)}
#bet.open{display:flex}
#bet .bhd{flex:none;padding:8px 8px 4px;border-bottom:1px solid rgba(255,255,255,.1)}
#bet .ttl{display:flex;align-items:baseline;gap:6px;font-size:12px;margin-bottom:6px}
#bet .ttl b{font-size:15px}
#bet .money{margin-left:auto;font-weight:800;color:#ffd66b;font-size:13px}
#bet .tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
#bet .tabs button{padding:7px 0;font-size:12px}
#bet .tabs button:disabled{opacity:.3}
#bet .hint{margin:6px 2px 2px;font-size:11px;opacity:.8;min-height:14px}
#bet .blist{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 6px}
#bet .row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.07);cursor:pointer}
#bet .row.fc{background:rgba(255,255,255,.05)}
#bet .row.sel{background:rgba(255,204,51,.2)}
#bet .nm{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bet .nm small{display:flex;align-items:center;gap:3px;font-size:10px;font-weight:500;opacity:.8;margin-top:1px}

#bet .pp small{display:block;font-size:9px;font-weight:500;opacity:.6}

#bet .ob b{font-size:15px}
#bet .ob i{font-style:normal;font-size:10px;color:#d62828;font-weight:800}
#bet .tap,#bet .axis{min-width:74px;text-align:center;font-size:11px;opacity:.55}
#bet .axis{opacity:1;color:#ffcc33;font-weight:800;font-size:13px}
#bet .bft{flex:none;display:flex;align-items:center;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.12);background:#0a131d}

#bet .bft .u b{min-width:62px;text-align:center;font-size:14px;white-space:nowrap}
#bet .bft .u button{padding:8px 9px}
#bet .bft .tot{font-size:10px;opacity:.9;line-height:1.2;text-align:right;min-width:58px}

#bet .bft button:disabled{opacity:.35}
#bet .refill{margin:0 8px 8px}
#bet .sp,#focus .sp{color:#ffcc33;font-weight:800}
#bet .sp2,#focus .sp2{color:#ff4d6d;font-weight:900;text-shadow:0 0 6px rgba(255,77,109,.6)}
#tickets{display:none;position:fixed;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));width:min(320px,calc(100% - 16px));max-height:45vh;overflow-y:auto;background:rgba(10,20,30,.9);color:#fff;border-radius:12px;padding:8px 10px;font-size:12px;z-index:5}
#tickets .th{display:flex;align-items:center;gap:8px;margin-bottom:4px}
#tickets .th span{margin-left:auto;color:#ffd66b;font-weight:700}
#tickets .th button{padding:2px 9px}
#tickets .tk{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid rgba(255,255,255,.1)}
#tickets .ty{width:34px;font-weight:700}
#tickets .hs{display:flex;align-items:center;gap:3px;flex-wrap:wrap}
#tickets .hs small{font-size:10px;opacity:.75;margin-right:2px}
#tickets .am{margin-left:auto;text-align:right;font-weight:700}
#tickets .am small{display:block;font-weight:500;font-size:10px;opacity:.75}
#tickets .empty{opacity:.6}
#bet .sts{display:flex;gap:3px;margin-top:3px;flex-wrap:nowrap}
#bet .st,#focus .st{display:inline-flex;align-items:center;gap:1px;font-size:9px;font-weight:600;opacity:.9}
.rk{white-space:nowrap;font-style:normal;display:inline-block;min-width:13px;padding:0 2px;border-radius:3px;text-align:center;font-size:9px;font-weight:900;color:#fff;line-height:13px;text-shadow:0 0 2px rgba(0,0,0,.5)}
#focus .rk{font-size:11px;line-height:16px;min-width:18px}
#bet .row.mine{background:rgba(255,77,109,.16)}
#bet .row.strong{position:relative;box-shadow:inset 0 0 0 1px rgba(255,214,120,.55),inset 0 0 12px rgba(255,200,90,.22);border-radius:6px;animation:strongGlow 2.4s ease-in-out infinite}
@keyframes strongGlow{50%{box-shadow:inset 0 0 0 1px rgba(255,224,150,.8),inset 0 0 18px rgba(255,200,90,.38)}}
#bet .myh{display:inline-block;font-size:9px;color:#ff4d6d;font-weight:900;margin-right:4px}
#stable{display:none;position:fixed;inset:0;flex-direction:column;background:#0d1824;color:#fff;font-size:13px;z-index:30}
#stable .shd{flex:none;padding:10px 10px 6px;border-bottom:1px solid rgba(255,255,255,.1)}
#stable .ttl{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
#stable .ttl b{font-size:16px}
#stable .money{margin-left:auto;font-weight:800;color:#ffd66b}
#stable .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
#stable .tabs button{padding:8px 0}
#stable .sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 10px}
#stable .card{background:rgba(255,255,255,.06);border-radius:12px;padding:10px;margin-bottom:10px}
#stable .ch{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
#stable .ch b{font-size:15px}
#stable .cls{background:#2a6fb0;border-radius:5px;padding:1px 6px;font-size:11px;font-weight:700}
#stable .cr{font-size:11px;opacity:.8;margin-bottom:5px;display:flex;align-items:center;gap:4px}
#stable .hpb{display:flex;align-items:center;gap:6px;font-size:11px;margin-bottom:6px}
#stable .hpb .bar{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
#stable .hpb .bar i{display:block;height:100%}
#stable .sts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
#stable .st{display:inline-flex;align-items:center;gap:2px;font-size:10px}
#stable .st small{opacity:.6;font-size:9px}
#stable .acts,#stable .tstat,#stable .tgrade{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
#stable .acts button{flex:1;padding:8px 4px;font-size:12px}
#stable .tstat button{padding:5px 8px;font-size:11px}
#stable .tstat .care{background:#ffe1ec;color:#c2185b}
#stable .tstat .care.on{background:#ff4d6d;color:#fff}
#stable .tgrade button{flex:1;padding:5px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center}
#stable .tgrade small{font-size:9px;opacity:.7}
#stable .trate{font-size:12px;opacity:.9}
#stable .trate b{color:#ffcc33;font-size:15px}
#stable .inj{color:#ff6b6b;font-weight:700;margin-bottom:6px}
#stable .retire{margin-top:8px;padding:4px 10px;font-size:11px;background:rgba(255,255,255,.15);color:#fff}
#stable .buy{display:flex;align-items:center;gap:10px}
#stable .buy b{font-size:16px;color:#ffd66b}
#stable .buy button{margin-left:auto}
#stable .log{background:rgba(255,204,51,.12);border-radius:10px;padding:8px 10px;margin-bottom:10px;font-size:12px;line-height:1.6}
#stable .empty{opacity:.6;padding:20px 4px;text-align:center}
#stable .hint{opacity:.7;font-size:12px;margin:4px 2px 8px}
#stable .gacha{text-align:center;padding-top:10px}
#stable .rates{font-size:12px;margin-bottom:12px;font-weight:700}
#stable .big{padding:14px 26px;font-size:16px}
#stable .gres{margin-top:16px;border:2px solid;border-radius:14px;padding:14px;text-align:left}
#stable .rar{font-size:28px;font-weight:900;text-align:center}
#stable .sft{flex:none;display:flex;align-items:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.12);background:#0a131d}
#stable .chk{display:flex;align-items:center;gap:5px;font-size:11px;max-width:120px}
#stable .cost{font-size:10px;opacity:.9;line-height:1.2}
#stable .cost b{font-size:13px}
#stable .cost .sal{color:#34c759}
#stable .cost small{display:block;font-size:9px;opacity:.75}
#stable #nextWeek{margin-left:auto;padding:11px 14px}
#stable button:disabled{opacity:.4}
#stable.half{top:0;background:transparent}
#stable.half .sbody{background:linear-gradient(#f7f1de,#efe4c6)}
#stable .v3d{flex:none;pointer-events:none}
#stable.half .shd{display:none}
#stable .hrow{background:rgba(255,255,255,.06);border-radius:12px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
#stable .hr1{display:flex;align-items:center;gap:6px;margin-bottom:5px}
#stable .hr1 b{font-size:15px}
#stable .hr1 .arrow{margin-left:auto;font-size:20px;opacity:.5}
#stable .injt{background:#ff3b30;border-radius:5px;padding:1px 6px;font-size:10px;font-weight:800}
#stable .hrow .sts{margin-bottom:0}
#stable .back{padding:4px 9px;font-size:12px;margin-right:4px}
#stable .tstat button{display:flex;flex-direction:column;align-items:center;line-height:1.2}
#stable .tstat button small{font-size:9px;opacity:.65;font-weight:500}
#train{display:none;position:fixed;left:0;right:0;bottom:0;top:62%;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#0d1824;color:#fff;z-index:40;text-align:center;box-sizing:border-box}
#train .tt b{font-size:19px}

#train .tn{opacity:.8;font-size:13px}

#train .tr.wait{opacity:.6}
#train .big{font-size:24px;font-weight:900}
#train .ok{color:#ffcc33}
#train .ng{color:#9aa4ae}
#train .rup{color:#ff4d6d}
#train .inj{color:#ff6b6b;font-weight:700}

#train .tnext{margin-top:auto;padding:11px 26px;font-size:15px}
#stable .sched{background:rgba(255,255,255,.05);border-radius:12px;padding:8px;margin-bottom:10px}
#stable .sct{font-size:12px;font-weight:700;margin-bottom:6px}

#stable .sc small{font-size:8px;opacity:.6}

#stable .ngk{color:#ff6b6b;margin-left:6px;font-weight:700}
#stable .done{color:#ffcc33;font-weight:700;margin-bottom:6px;font-size:12px}
#stable .go{width:100%;margin-top:8px;padding:11px}

#stable .nt{font-size:15px;font-weight:800;margin-bottom:10px}

</style>

<script src="three.min.js"></script>
<script src="/socket.io/socket.io.js" onerror="window.__noSock = true"></script>
<script>
// ================= コース定義 =================
const LT = 2000;                          // 1周2000m
const L = 500, TW = 22;                   // 直線長, コース幅(m)
const R = (LT - 2 * L) / (2 * Math.PI);   // コーナー半径(≒159m)
const SF = 400;                           // ゴール板 = 最終コーナー出口から400m(最後の直線)
let D = 1200, S0 = 0;                     // レース距離(育成モードは史実の距離、馬券モードは1200m)とゲート位置(ゴール板からD逆算)
function setDistance(d) { D = d; S0 = (((SF - D) % LT) + LT) % LT; }
setDistance(1200);

// s: 内ラチ沿いの距離, d: 内ラチからの外側オフセット
function tp(s, d) {
  s = ((s % LT) + LT) % LT;
  let x, z, dx, dz, nx, nz;
  if (s < L) { x = -L / 2 + s; z = R; dx = 1; dz = 0; nx = 0; nz = 1; }
  else if (s < L + Math.PI * R) { const t = (s - L) / R; x = L / 2 + R * Math.sin(t); z = R * Math.cos(t); dx = Math.cos(t); dz = -Math.sin(t); nx = Math.sin(t); nz = Math.cos(t); }
  else if (s < 2 * L + Math.PI * R) { const u = s - L - Math.PI * R; x = L / 2 - u; z = -R; dx = -1; dz = 0; nx = 0; nz = -1; }
  else { const t = (s - 2 * L - Math.PI * R) / R; x = -L / 2 - R * Math.sin(t); z = -R * Math.cos(t); dx = -Math.cos(t); dz = Math.sin(t); nx = -Math.sin(t); nz = -Math.cos(t); }
  return { x: x + nx * d, z: z + nz * d, dx, dz };
}

// ================= 基本セットアップ =================
const appEl = document.getElementById('app');
const appW = () => appEl.clientWidth || innerWidth;          // PCでは中央カラムの幅、スマホでは画面幅
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(appW(), innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
appEl.insertBefore(renderer.domElement, appEl.firstChild);   // 3Dは一番奥に(上に重なるUIを隠さない)

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9cc8ee);
scene.fog = new THREE.Fog(0x9cc8ee, 320, 1500);
const camera = new THREE.PerspectiveCamera(40, appW() / innerHeight, 0.5, 2500);

const hemi = new THREE.HemisphereLight(0xe6f2ff, 0x4f6b3a, 0.8); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 0.85);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 320 });
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

const M = c => new THREE.MeshLambertMaterial({ color: c });
function canvasTex(w, h, draw, rx, ry) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return t;
}
function speckle(g, w, h, n, cols) {
  for (let i = 0; i < n; i++) { g.fillStyle = cols[i % cols.length]; g.fillRect(Math.random() * w, Math.random() * h, 2, 2); }
}

// ================= 地面・コース =================
const fieldTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#4c8a3a'; g.fillRect(0, 0, w, h);
  speckle(g, w, h, 4000, ['rgba(30,70,25,.35)', 'rgba(120,180,90,.25)']);
}, 90, 90);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(2600, 2600), new THREE.MeshLambertMaterial({ map: fieldTex }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// 芝コース(刈り込みの縞でスピード感を出す)
const turfTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#5fa847'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#6fbb55'; g.fillRect(0, 0, w / 2, h);
  speckle(g, w, h, 3000, ['rgba(40,90,30,.25)', 'rgba(160,215,120,.22)']);
}, 1 / 14, 1 / 14);
function ring(d, n = 360) { const a = []; for (let i = 0; i < n; i++) { const p = tp(i / n * LT, d); a.push(new THREE.Vector2(p.x, -p.z)); } return a; }
const shape = new THREE.Shape(ring(TW + 1));
shape.holes.push(new THREE.Path(ring(-0.8)));
const trackGeo = new THREE.ShapeGeometry(shape); trackGeo.rotateX(-Math.PI / 2);
const dirtTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#a5794f'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#ad8259'; g.fillRect(0, 0, w / 2, h);
  speckle(g, w, h, 5000, ['rgba(80,50,25,.35)', 'rgba(220,180,130,.3)']);
}, 1 / 14, 1 / 14);
const track = new THREE.Mesh(trackGeo, new THREE.MeshLambertMaterial({ map: turfTex }));
track.position.y = 0.03; track.receiveShadow = true; scene.add(track);

// 内ラチ・外ラチ
const white = M(0xffffff);
function railCurve(d, y) { const a = []; for (let i = 0; i < 240; i++) { const p = tp(i / 240 * LT, d); a.push(new THREE.Vector3(p.x, y, p.z)); } return new THREE.CatmullRomCurve3(a, true); }
scene.add(new THREE.Mesh(new THREE.TubeGeometry(railCurve(-0.6, 1.0), 720, 0.07, 6, true), white));
scene.add(new THREE.Mesh(new THREE.TubeGeometry(railCurve(TW + 0.6, 1.1), 720, 0.07, 6, true), white));
{
  const pg = new THREE.BoxGeometry(0.1, 1, 0.1); pg.translate(0, 0.5, 0);
  const n = Math.floor(LT / 5), im = new THREE.InstancedMesh(pg, white, n * 2), m = new THREE.Matrix4();
  for (let i = 0; i < n; i++) {
    const a = tp(i * 5, -0.6), b = tp(i * 5, TW + 0.6);
    m.makeTranslation(a.x, 0, a.z); im.setMatrixAt(i, m);
    m.makeTranslation(b.x, 0, b.z); im.setMatrixAt(n + i, m);
  }
  scene.add(im);
}
// 残り距離ハロン棒(100mごと)
for (let k = 1; k * 100 < LT; k++) {
  const p = tp(SF - k * 100, -1.6);
  const pole = new THREE.Mesh(new THREE.BoxGeometry(0.16, 3.2, 0.16), M(k % 2 ? 0xd93636 : 0xffffff));
  pole.position.set(p.x, 1.6, p.z); pole.castShadow = true; scene.add(pole);
  const sign = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.05), M(0xffffff));
  sign.position.set(p.x, 3.1, p.z); scene.add(sign);
}
// ゴールライン・ゴール板
{
  const gx = tp(SF, 0).x;
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.02, TW + 1), white);
  line.position.set(gx, 0.05, R + TW / 2); scene.add(line);
  // ゴール板はコースの内側。スタンドから見える面に「GOAL」
  const gz = R - 2.2;
  const post = new THREE.Mesh(new THREE.BoxGeometry(0.3, 5.2, 0.3), white);
  post.position.set(gx, 2.6, gz); post.castShadow = true; scene.add(post);
  const gc = document.createElement('canvas'); gc.width = 256; gc.height = 128;
  const g = gc.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = '#d93636'; g.lineWidth = 10; g.strokeRect(5, 5, 246, 118);
  g.fillStyle = '#d93636'; g.font = 'bold 76px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('GOAL', 128, 68);
  const gm = new THREE.MeshLambertMaterial({ map: new THREE.CanvasTexture(gc) });
  const board = new THREE.Mesh(new THREE.BoxGeometry(2.8, 1.4, 0.12), [white, white, white, white, gm, gm]);
  board.position.set(gx, 5.7, gz); board.castShadow = true; scene.add(board);
}
// スタンド
const STAND_X = tp(SF, 0).x - 60;
{
  const gray = M(0xb9bcc2), dark = M(0x6d7480), roofM = M(0x2a6fb0);
  const sx = STAND_X;
  for (let i = 0; i < 7; i++) {
    const h = 1.5 + i * 1.6;
    const st = new THREE.Mesh(new THREE.BoxGeometry(300, h, 5), i % 2 ? gray : dark);
    st.position.set(sx, h / 2, R + TW + 26 + i * 5); st.receiveShadow = true; scene.add(st);
  }
  const back = new THREE.Mesh(new THREE.BoxGeometry(300, 22, 4), gray);
  back.position.set(sx, 11, R + TW + 62); scene.add(back);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(304, 1, 40), roofM);
  roof.position.set(sx, 22, R + TW + 44); roof.rotation.x = -0.08; scene.add(roof);
}
// 内馬場の池と木
{
  const lake = new THREE.Mesh(new THREE.CircleGeometry(1, 48), M(0x3f8fc9));
  lake.scale.set(120, 50, 1); lake.rotation.x = -Math.PI / 2; lake.position.set(-90, 0.05, 0); scene.add(lake);
  const tg = new THREE.CylinderGeometry(0.3, 0.45, 2, 6); tg.translate(0, 1, 0);
  const lg = new THREE.ConeGeometry(2.3, 6, 7); lg.translate(0, 5, 0);
  const N = 170, tr = new THREE.InstancedMesh(tg, M(0x6b4a2b), N), lv = new THREE.InstancedMesh(lg, M(0x2f6e3a), N);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), ps = new THREE.Vector3();
  for (let i = 0; i < N; i++) {
    let x, z;
    if (i < 60) { x = 60 + Math.random() * 280 - 30; z = (Math.random() - 0.5) * (R * 1.4); }
    else {
      const a = Math.random() * Math.PI * 2;
      x = Math.cos(a) * (L / 2 + R + TW + 60 + Math.random() * 200);
      z = Math.sin(a) * (R + TW + 60 + Math.random() * 200);
      if (z > 0 && Math.abs(x - STAND_X) < 190) z = -z;
    }
    const s = 0.8 + Math.random() * 0.8;
    m.compose(ps.set(x, 0, z), q, sc.set(s, s, s)); tr.setMatrixAt(i, m); lv.setMatrixAt(i, m);
  }
  lv.castShadow = true; scene.add(tr, lv);
}

// ================= ブロック馬 =================
function box(w, h, d, mat, x, y, z, parent) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; parent.add(m); return m;
}
// ゼッケン：大きく馬番、その下に小さく馬名(長い名前は横幅に収まるよう縮める)
function numTex(n, name) {
  const c = document.createElement('canvas'); c.width = 256; c.height = 192;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 256, 192);
  g.fillStyle = '#111'; g.textAlign = 'center'; g.textBaseline = 'middle';
  if (!name) { g.font = 'bold 132px sans-serif'; g.fillText(String(n), 128, 104); }
  else {
    g.font = 'bold 100px sans-serif'; g.fillText(String(n), 128, 66);
    g.font = 'bold 46px sans-serif';                       // 馬名は高さを保ったまま、長ければ横だけ縮める
    const w = g.measureText ? g.measureText(name).width : 0, sx = w > 246 ? 246 / w : 1;
    g.save(); g.translate(128, 152); g.scale(sx, 1); g.fillText(name, 0, 0); g.restore();
  }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}

class Horse {
  constructor(o, num, showName = false) {   // showName: レース中の馬だけゼッケンに馬名を入れる
    this.phase = Math.random();
    const root = this.root = new THREE.Group();
    const body = this.body = new THREE.Group(); root.add(body);
    const coat = M(o.coat), mane = M(o.mane), hoof = M(0x222222), sock = M(0xf2f0ea);

    // 胴体
    box(1.7, 0.78, 0.72, coat, 0, 1.55, 0, body);      // 胴
    box(0.72, 0.86, 0.78, coat, -0.78, 1.6, 0, body);  // 尻
    box(0.6, 0.84, 0.74, coat, 0.74, 1.6, 0, body);    // 胸
    // ゼッケン
    const nm = new THREE.MeshLambertMaterial({ map: numTex(num, showName ? o.name : '') }), wm = M(0xffffff);
    box(0.78, 0.56, 0.76, [wm, wm, wm, wm, nm, nm], 0.02, 1.62, 0, body);

    // 首・頭
    const neck = this.neck = new THREE.Group(); neck.position.set(0.95, 1.82, 0); neck.rotation.z = -0.75; body.add(neck);
    box(0.44, 1.05, 0.36, coat, 0, 0.5, 0, neck);
    box(0.1, 1.0, 0.14, mane, -0.25, 0.5, 0, neck);
    const head = this.head = new THREE.Group(); head.position.set(0, 1.0, 0); head.rotation.z = 0.2; neck.add(head);
    box(0.72, 0.34, 0.3, coat, 0.25, 0, 0, head);
    box(0.14, 0.28, 0.26, mane, 0.6, -0.02, 0, head);
    box(0.07, 0.17, 0.06, coat, -0.04, 0.24, 0.09, head);
    box(0.07, 0.17, 0.06, coat, -0.04, 0.24, -0.09, head);
    if (o.blaze) box(0.5, 0.05, 0.1, sock, 0.28, 0.17, 0, head); // 流星

    // しっぽ
    const tail = this.tail = new THREE.Group(); tail.position.set(-1.12, 1.85, 0); body.add(tail);
    box(0.14, 0.85, 0.16, mane, 0, -0.42, 0, tail);

    // 脚(付け根にGroupを置いてそこを回転)
    this.legs = {};
    const def = { LF: [0.8, -0.24, 1], RF: [0.8, 0.24, 1], LH: [-0.82, -0.24, 0], RH: [-0.82, 0.24, 0] };
    for (const k in def) {
      const [x, z, front] = def[k];
      const hip = new THREE.Group(); hip.position.set(x, 1.28, z); body.add(hip);
      box(front ? 0.2 : 0.26, 0.62, 0.2, coat, 0, -0.31, 0, hip);
      const knee = new THREE.Group(); knee.position.y = -0.6; hip.add(knee);
      box(0.13, 0.58, 0.13, o.socks.includes(k) ? sock : coat, 0, -0.29, 0, knee);
      box(0.17, 0.1, 0.2, hoof, 0.02, -0.62, 0, knee);
      this.legs[k] = { hip, knee, front };
    }

    // 騎手
    const jk = this.jockey = new THREE.Group(); jk.position.set(0.12, 1.98, 0); body.add(jk);
    const silk = M(o.silk), pants = M(0xf5f5f5), cap = M(o.cap);
    const torso = box(0.58, 0.3, 0.34, silk, 0.05, 0.42, 0, jk); torso.rotation.z = -0.18;
    box(0.26, 0.24, 0.24, cap, 0.38, 0.6, 0, jk);
    for (const s of [-1, 1]) {
      const th = box(0.36, 0.13, 0.12, pants, -0.08, 0.16, s * 0.22, jk); th.rotation.z = 0.5;
      const sh = box(0.1, 0.34, 0.1, M(0x222222), 0.06, -0.02, s * 0.24, jk); sh.rotation.z = -0.4;
      const arm = box(0.42, 0.09, 0.09, silk, 0.42, 0.33, s * 0.17, jk); arm.rotation.z = -0.55;
    }
  }

  // 常歩(なみあし)：4拍子で 左後→左前→右後→右前 の順に1本ずつ脚を出す
  walk(P, a) {
    const off = { LH: 0, LF: 0.25, RH: 0.5, RF: 0.75 };
    for (const k in this.legs) {
      const g = this.legs[k], th = P + off[k] * Math.PI * 2, sw = Math.max(0, Math.cos(th));   // swing中だけ膝を曲げる
      g.hip.rotation.z = (g.front ? 0.34 : 0.28) * Math.sin(th) * a + (g.front ? 0.03 : -0.03) * a;
      g.knee.rotation.z = (g.front ? -0.85 : 0.6) * sw * a;
    }
    this.body.position.y = Math.abs(Math.sin(P * 2)) * 0.035 * a;     // 1完歩で2回の小さな上下
    this.body.rotation.x = Math.sin(P) * 0.025 * a;                   // 左右にわずかに揺れる
  }
  // v: 速度(m/s)。速度でphaseを進めるので足が滑らない
  update(v, dt) {
    this.phase += v * dt / 6.8;                    // 1完歩 ≒ 6.8m
    const a = Math.min(1, v / 9);                  // 立ち止まり→全力の補間
    const P = this.phase * Math.PI * 2;
    const off = { LH: 0, RH: 0.1, LF: 0.5, RF: 0.6 }; // 後ろ脚→前脚の順で着地
    for (const k in this.legs) {
      const g = this.legs[k], th = P + off[k] * Math.PI * 2, s = Math.sin(th), c = Math.cos(th);
      if (g.front) {
        g.hip.rotation.z = (0.62 * s + 0.08) * a;
        g.knee.rotation.z = -1.35 * Math.max(0, c) * a;   // 前脚は膝を後ろに畳む
      } else {
        g.hip.rotation.z = (0.5 * s - 0.08) * a;
        g.knee.rotation.z = 0.9 * Math.max(0, c) * a;     // 後ろ脚は飛節で前に畳む
      }
    }
    const bob = (Math.sin(P) * 0.5 + 0.5) * 0.09 * a;
    this.body.position.y = bob;
    this.body.rotation.z = Math.sin(P + 1.2) * 0.045 * a;
    this.neck.rotation.z = -0.75 - 0.2 * a + Math.sin(P + 0.6) * 0.13 * a;
    this.tail.rotation.z = -0.35 - 0.75 * a + Math.sin(P * 2) * 0.08 * a;
    this.jockey.position.y = 1.98 - bob * 0.7;   // 騎手は揺れを吸収する
  }
}

// ================= 出走馬 =================
const WAKU = ['#ffffff', '#222222', '#e53935', '#1e66d0', '#f7d117', '#2e9d4a', '#f39c12', '#f48fb1'];
const WAKU_TXT = ['#111', '#fff', '#fff', '#fff', '#111', '#fff', '#fff', '#111'];
const DATA = [

function avoidOverlap(dt) {

  planOrder.forEach((h, k) => { const r = runners[h]; T0 = Math.max(T0, raceT + runTime(r.v, vmax(r), D - r.trav) - gaps[k] + 0.05); });
  planOrder.forEach((h, k) => {
    const r = runners[h], rem = D - r.trav, goal = T0 + gaps[k] - raceT;
    let lo = 5, hi = vmax(r);
    for (let n = 0; n < 50; n++) { const m = (lo + hi) / 2; if (runTime(r.v, m, rem) > goal) lo = m; else hi = m; }
    r.boost = hi;
  });
}

const STYLE_W = { '逃げ': 1, '先行': 1.4, '差し': 1.4, '追込': 1, '大逃げ': 0.25, 'まくり': 0.45, '直線一気': 0.45,

const STYLE_MAX = { '大逃げ': 3, '超大逃げ': 1, '超まくり': 1, '超直線一気': 1 };
function assignStyles() {
  // NPCは通常4脚質だけ(特殊脚質はプレイヤーの馬だけが使える)。4脚質とも必ず1頭以上
  const names = ['逃げ', '先行', '差し', '追込'], list = [...names];
  while (list.length < N_HORSE) {
    const cand = names.filter(n => !STYLE_MAX[n] || list.filter(x => x === n).length < STYLE_MAX[n]);
    let x = Math.random() * cand.reduce((a, n) => a + STYLE_W[n], 0), k = 0;
    while (k < cand.length - 1 && (x -= STYLE_W[cand[k]]) > 0) k++;
    list.push(cand[k]);
  }
  shuffle(list).forEach((st, i) => runners[i].o.style = st);
}

// クリックは1か所でまとめて処理(スクロール位置を保つため描き直し後に戻す)
betSheet.addEventListener('click', ev => {
  const el = ev.target.closest('button, .row'); if (!el) return;
  const list = betSheet.querySelector('.blist'), sc = list ? list.scrollTop : 0;
  const d = el.dataset;
  if (d.t) { betType = d.t; axis = -1; }
  else if (d.u) unitIdx = Math.min(UNITS.length - 1, Math.max(0, unitIdx + +d.u));
  else if (d.undo !== undefined) {
    const last = history.pop();
    if (last) { const b = slip.find(x => x.key === last.key); b.amt -= last.amt; if (b.amt <= 0) slip.splice(slip.indexOf(b), 1); }
  }
  else if (d.buy) {
    const type = d.buy, h = d.h.split(',').map(Number), key = comboKey(type, h);
    const amt = Math.min(unit(), money - slipTotal());     // 足りないときは残りを全額ベット
    if (amt <= 0) flash = '所持金がありません';
    else {
      const b = slip.find(x => x.key === key);
      if (b) b.amt += amt; else slip.push({ key, type, h, amt, odds: odds(type, h) });
      history.push({ key, amt });
      if (amt < unit()) flash = `残り${yen(amt)}を全額ベットしました`;
    }
  }
  else if (d.row !== undefined) {
    const h = +d.row; focusHorse(h, true);
    if (betType === 'umaren' || betType === 'umatan') axis = axis === h ? -1 : h;
  }
  else if (el.id === 'buyGo') {
    if (race.online) { if (!online.waiting) { money -= slipTotal(); saveMoney(); online.waiting = true; if (sock) sock.emit('ready'); } renderBet(); return; }
    money -= slipTotal(); saveMoney(); closeBet();

});

function startPaddock() {
  state = 'paddock';
  runners.forEach(r => {
    r.ws = Math.random() * 900 - 150; r.wv = 6.5 + Math.random() * 3.5; r.wl = 3 + Math.random() * 15;
  });
  focusHorse(0, false);
}
function paddockStep(dt) {
  for (const r of runners) {
    r.ws += r.wv * dt;
    const p = tp(r.ws, r.wl);
    r.h.root.position.set(p.x, 0, p.z); r.h.root.rotation.y = -Math.atan2(p.dz, p.dx);
    r.h.update(r.wv, dt);
  }
  focusT += dt; focusLock = Math.max(0, focusLock - dt);
  if (focusT > 5 && !focusLock) {
    focusHorse((focusH + 1) % N_HORSE, false);
    betSheet.querySelectorAll('.row').forEach(el => el.classList.toggle('fc', +el.dataset.row === focusH)); // 描き直さずに強調だけ移す
  }
}
const focusEl = document.getElementById('focus');
function updateFocusLabel() {
  if (state !== 'paddock') { focusEl.style.display = 'none'; return; }
  const r = runners[focusH];
  focusEl.style.display = 'flex';
  focusEl.innerHTML = `${badge(focusH)}<b>${r.o.name}</b><span>${styleTag(r.o.style)}</span>${condIcon(focusH)}<span>${pop[focusH]}番人気</span>`;
}

function hits(type, h, o) {         // o: 着順(馬番index配列)
  const top3 = o.slice(0, 3);
  switch (type) {
    case 'tan': return h[0] === o[0];
    case 'fuku': return top3.includes(h[0]);
    case 'umatan': return h[0] === o[0] && h[1] === o[1];
    case 'umaren': return h.includes(o[0]) && h.includes(o[1]);
    case 'santan': return h[0] === o[0] && h[1] === o[1] && h[2] === o[2];
    case 'sanfuku': return h.every(x => top3.includes(x));
  }
}
function settle() {
  settled = true; ticketsOpen = false; ticketBtn.classList.remove('on'); renderTickets();
  speed = 1; spdBtn.textContent = '1x';                    // レース終了時は必ず等速に戻す
  const o = finish.map(r => r.i), top3 = o.slice(0, 3);
  let pay = 0;
  const mine = slip.map(b => {
    const hit = hits(b.type, b.h, o), p = hit ? Math.floor(b.amt * b.odds / 10) * 10 : 0;
    pay += p; return { ...b, hit, p };
  });
  money += pay; saveMoney();
  reportBets(slip.reduce((s, b) => s + b.amt, 0), pay, mine);
  if (race.online && sock && online.room && online.room.host === player.id) sock.emit('raceResult', { order: o });
  const off = [
    ['単勝', 'tan', [o[0]]], ...top3.map(x => ['複勝', 'fuku', [x]]),
    ['馬連', 'umaren', normSel('umaren', [o[0], o[1]])], ['馬単', 'umatan', [o[0], o[1]]],
    ['3連複', 'sanfuku', normSel('sanfuku', top3)], ['3連単', 'santan', top3],
  ];
  const spent = slip.reduce((s, b) => s + b.amt, 0);
  settleSheet.innerHTML = `
  <div class="hd"><b>第${raceNo}R 結果</b> ${race.cls.n} <span class="money">所持金 ${yen(money)}</span></div>
  <div class="podium">${top3.map((h, k) => `<div>${k + 1}着 ${badge(h)} ${runners[h].o.name}<small>${pop[h]}番人気</small></div>`).join('')}</div>
  <table class="pay"><thead><tr><th>券種</th><th>組番</th><th>払戻(100円)</th></tr></thead><tbody>
    ${off.map(([n, t, h]) => `<tr><td>${n}</td><td>${comboTxt(t, h)}</td><td class="r">${yen(Math.floor(100 * odds(t, h) / 10) * 10)}</td></tr>`).join('')}
  </tbody></table>
  <div class="slip">${mine.length ? mine.map(b => `<div class="sl ${b.hit ? 'hit' : 'miss'}"><span>${TYPE[b.type].name}</span><b>${comboTxt(b.type, b.h)}</b><span>${yen(b.amt)}</span><span class="r">${b.hit ? '的中 +' + yen(b.p) : 'はずれ'}</span></div>`).join('') : '<div class="empty">今回は見送り</div>'}</div>
  <div class="ft"><span>購入 ${yen(spent)} → 払戻 <b>${yen(pay)}</b></span><button id="nextRace" class="main">${race.online ? 'ロビーに戻る' : '厩舎に戻る'}</button></div>`;
  settleSheet.style.display = 'block';
  document.getElementById('nextRace').onclick = () => { settleSheet.style.display = 'none'; onWatchedRaceDone(o); };
}

// ===== 週の進行 =====
function applyResult(h, pos, c, name) {
  const prize = pos <= 5 ? Math.floor(PRIZE[c] * PRIZE_RATE[pos - 1]) : 0, wr = { n: name || weekRace(game.week).n };

  let msg = `${h.name}：${wr.n} ${pos}着${prize ? `（賞金 ${yen(prize)}）` : ''}`;
  if (pos === 1) {
    h.wins = h.wins || {}; h.wins[c] = (h.wins[c] || 0) + 1;
    if (c === 5 || c === 6) { h.yearG1 = (h.yearG1 || 0) + 1; msg += ` 🏆G1制覇！（今年${h.yearG1}勝）`; game.g1Total = (game.g1Total || 0) + 1; }
    if (c === 7) { msg += ' 👑レジェンド制覇！'; game.lgTotal = (game.lgTotal || 0) + 1; if ((h.wins[7] || 0) >= 3) msg += ' ✨この馬の子は第2層「幻境」へ行けます'; }
    if (c === 13 || c === 14) { h.yearG1 = (h.yearG1 || 0) + 1; msg += ` 🔮幻境G1制覇！（今年${h.yearG1}勝）`; }
    if (c === 15) msg += ' 🌌幻境レジェンド制覇！';
    if (BGACHAS[c]) { game.btix[c] = (game.btix[c] || 0) + 1; msg += ` 🎟${BGACHAS[c].n}ガチャ券ゲット`; }

function instantRace(cls, owned, surface) {
  const keep = race, keepTitle = raceTitle;
  genRace(); race.cls = cls; if (surface) race.surface = surface;
  const st = genField(cls), slots = shuffle([...Array(N_HORSE).keys()]).slice(0, owned.length);
  owned.forEach((h, k) => st[slots[k]] = h.st);
  const w = st.map((x, i) => { const k = slots.indexOf(i); return Math.exp((calcAbility(x) - 70) / TAU) * COND[k >= 0 ? owned[k].cond : rollCond(x.hlt)].f; });

  while (left.length) { let x = Math.random() * left.reduce((a, i) => a + w[i], 0), k = 0; while (k < left.length - 1 && (x -= w[left[k]]) > 0) k++; order.push(left.splice(k, 1)[0]); }
  const res = owned.map((h, k) => [h, order.indexOf(slots[k]) + 1]);
  race = keep;

// トレーニングはボタンを押した瞬間に実行して専用画面へ
function restNow(h) {
  if (!h || locked(h) || h.injured) return;
  const before = Math.round(h.hp);
  h.hp = Math.min(100, h.hp + 35); h.rested = true; h.act.type = 'none';
  h.restMsg = `ゆっくり休んだ！ 体力 ${before} → ${Math.round(h.hp)}`;
  game.log = [`${h.name}：休養（体力 ${before} → ${Math.round(h.hp)}）`];
  saveAll();

function trainNow(h) {
  if (hw(h) !== 2 && GRADES[h.act.grade].adv) h.act.grade = 4;   // 上級調教は第2層だけ
  const a = h.act, g = GRADES[a.grade];
  if (!h || locked(h) || h.injured || money < g.cost) return;
  money -= g.cost; h.trained = true;
  let item; const hpB = h.hp, condB = h.cond;
  // 必ず成功し、一部が大成功。上限に達していても成功・大成功の表示は普段どおり(上限は知らせない)
  const rate = trainRate(h, a.stat, a.grade), ok = Math.random() * 100 < rate, great = ok && Math.random() < GREAT_P[a.grade];
  if (a.stat === 'cond') {
    h.condCare = ok; if (great) h.cond = Math.max(0, h.cond - 1);        // 大成功ならその場で1段階上向く
    h.hp = Math.max(0, h.hp - 5);
    item = { h, t: TRAIN_OF.cond, grade: a.grade, ok, great, rate };
  } else {
    const tr = TRAIN_OF[a.stat], tired = h.hp < 30;

      const before = h.st[k];
      const up = (0.6 + Math.random() * 0.6) * g.gain * (tr.f || 1)   // トレセン(2000円)で鍛え続けると、G3級の素質の初代が数年かけて「G3をたまに勝てる」くらいになる伸び
         * Math.max(0.35, 1 - before / 140) * (great ? 2.5 : 1) * (tired ? 0.6 : 1);   // 高いほど伸びにくい。疲れていると伸びが鈍る
      h.st[k] = Math.min(Math.max(before, capOf(h, k)), clampStat(before + up)); h.grow[k] = (h.grow[k] || 0) + 1;

    // 上限に達した能力があれば10%の確率で、調教師が1つだけ「もう伸びない」と教えてくれる(複数あればランダムに1つ)
    const full = CAP_KEYS.filter(k => atCap(h, k));
    if (full.length && Math.random() < 0.1) item.capTalk = fill(pk(CAP_TALK), { s: statName(randPick(full)) });
    h.hp = Math.max(0, h.hp - 12 * Math.max(0, 1.2 - h.st.hlt / 100) * (tr.hp || 1));   // 健康が高くても体力は増えない(消費0が下限)

function advanceWeek() {

    const t = h.act.type, r = raceOf(hw(h));
    if (t === 'race' && eligible(h, r.c)[0] && h.hp - hltRaceCost(h.st.hlt) > 0) { (hw(h) === view ? entries : other).push(h); h.lastAct = 'race'; }
    else h.lastAct = h.rested ? 'rest' : h.trained ? 'train' : 'none';

function advanceRaces(entries, wr) {
  const cls = CLASSES[wr.c];

    if (entries.length) for (const [h, pos] of instantRace(cls, entries, wr.s)) applyResult(h, pos, wr.c, wr.n);
    else game.log.push(`今週の${wr.n}は開催されました`);

let curWeekRace = null;
function onWatchedRaceDone(order) {

// 調子は1週に1段階ずつしか動かない。休養すると下がりにくく、調子ケア成功で1段階上がる
function nextCond(h) {
  const c = h.cond;
  if (h.condCare) { h.condCare = false; return Math.max(0, c - 1); }
  const ha = (h.st.hlt - 50) / 400;
  let up = 0.15 + ha, down = 0.15 - ha;
  if (h.hp >= 80) { up += 0.2; down -= 0.1; }          // 体力が多いと上向きやすい
  else if (h.hp >= 60) { up += 0.1; }
  else if (h.hp < 40) down += 0.2;
  if (h.lastAct === 'race') down += 0.1;
  if (h.lastAct === 'rest') { up += 0.35; down *= 0.2; } // 休養するとしっかり上向く
  if (c === 0) { up = 0; down += 0.1; }          // 絶好調は維持が難しい
  if (c === 4) { down = 0; up += 0.1; }          // 絶不調からは戻りやすい
  down = Math.max(0, down); if (up + down > 1) up = 1 - down;
  const x = Math.random();
  return x < up ? c - 1 : x < up + Math.max(0, down) ? c + 1 : c;
}
function endWeek() {

function updatePasture(dt) {
  if (!pHorse) return;
  idle.t += dt;
  if (idle.t > idle.dur) {
    idle.mode = pick(['graze', 'walk', 'look', 'paw', 'graze'], [0.3, 0.25, 0.2, 0.1, 0.15]);
    idle.t = 0; idle.dur = idle.mode === 'walk' ? 3 + Math.random() * 3 : 2.5 + Math.random() * 4;

  }
  let nkT = -0.75, hdT = 0.2;
  // 歩き出し・止まりはゆっくり加減速。曲がるときも少しずつ
  const walking = idle.mode === 'walk' && idle.t < idle.dur - 0.8;
  idle.v += ((walking ? 1.35 : 0) - idle.v) * Math.min(1, dt * (walking ? 1.2 : 2.0));
  let turnT = idle.mode === 'walk' ? idle.turn : 0;
  if (Math.hypot(idle.x, idle.z) > 7) turnT = 0.9;                                    // 柵の内側に戻る
  idle.turnV += (turnT - idle.turnV) * Math.min(1, dt * 1.5);

  const vv = idle.v * (1 + 0.12 * Math.sin(idle.P * 2));                               // 一歩ごとの緩急
  idle.yaw += idle.turnV * dt * a;
  idle.x += Math.cos(idle.yaw) * vv * dt; idle.z -= Math.sin(idle.yaw) * vv * dt;
  if (idle.mode === 'walk') nkT = -0.95;
  else if (idle.mode === 'graze') { nkT = -2.55; hdT = -0.35 + Math.sin(idle.t * 7) * 0.06; }
  else if (idle.mode === 'look') { nkT = -0.5; hdT = 0.3; }
  pHorse.update(0, dt);                                // 基本姿勢に戻してから
  if (a > 0.02) pHorse.walk(idle.P, a);               // 常歩の脚運び
  idle.nk += (nkT - idle.nk) * Math.min(1, dt * 2.5); idle.hd += (hdT - idle.hd) * Math.min(1, dt * 3);
  pHorse.neck.rotation.z = idle.nk + Math.sin(idle.P * 2) * 0.07 * a;                 // 歩調に合わせて首を振る
  pHorse.head.rotation.z = idle.hd;
  if (idle.mode === 'paw') { const L = pHorse.legs.LF; L.hip.rotation.z = 0.35 + Math.sin(idle.t * 7) * 0.35; L.knee.rotation.z = -0.9; }

  const v = race.venue ? race.venue + '競馬場、' : '';
  if (big > 0 || RACE_LINES[race.name]) say(v + fill(pk(['{s}{d}m、天気は{w}、馬場は{b}の発表です', 'コースは{s}{d}m、{w}の{b}馬場です']), { s: race.surface, d: D, w: wx, b: baba }), 2);
  else say(fill(pk(['本日の{t}、{v}{s}{d}m。天気は{w}、馬場は{b}の発表です', '{t}！{v}{s}{d}mの舞台、{w}の{b}馬場で行われます', 'まもなく発走、{t}。{v}{s}{d}m、{b}馬場です']),
    { t: title, v, s: race.surface, d: D, w: wx, b: baba }), 2);
  say(fill(pk(['1番人気は{a}、2番人気に{b}', '注目の1番人気は{a}！続いて{b}', '人気を集めるのは{a}、対抗に{b}']), { a: nm(favs[0]), b: nm(favs[1]) }), 2);
  say(pk(['各馬ゲートに収まりました…体勢整いました！', '最後の1頭がゲートに入って…体勢完了！', '16頭ゲートイン完了、体勢整いました！']), 2);
}
// ===== 最後の直線 =====
// 呼ぶのは「画面に映っている1〜3番手」と「最終的に3着以内に来る馬」だけ。
// 大逃げの独走 → 後続が画面に入ってくる / 先頭だった馬が失速 / 後ろから一気 / 1着争い の各フェーズ
const LATE = /差し|追込|直線一気|まくり/;
function straightCommentary(order, rem, g) {
  const L = order[0], S = order[1], T = order[2], n = order.length;
  const fin = r => planOrder.indexOf(r.i);                // 最終着順(0=1着)。着順はスタート時点で決まっている
  const st = com.st || (com.st = { lead: L.i, out: new Set(), solo: false, surged: new Set(), battleT: -99, soloT: raceT, fillT: raceT, faded: false, held: false });
  // 同じ言い回しが続かないよう、直近に使った文は避けて選ぶ
  const sayS = (arr, o, prio = 2, exp = 2.6) => {
    const rec = st.rec || (st.rec = []), c = arr.filter(t => !rec.includes(t)), t = pk(c.length ? c : arr);
    rec.push(t); if (rec.length > 6) rec.shift();
    say(fill(t, o), prio, false, '', exp);
  };
  const gapB = (a, b) => (a.trav - b.trav) / BASHIN;
  // 画面の外にいた馬を記録(後ろから一気の判定用)
  for (const r of order) if (!onScr(r)) st.out.add(r.i);

  // --- 直線入口 ---
  once('st', () => {
    com.lastLeader = L.i; com.leadChgT = raceT;
    st.entry = Object.fromEntries(order.map((r, k) => [r.i, k]));   // 直線入口の順位(勝ち方の判定用)
    if (/大逃げ/.test(L.o.style) && gapB(L, S) >= 5) { st.solo = true; sayS(CT.soloIn, { a: nm(L), g: Math.round(gapB(L, S)) }, 3, 0); }
    else if (gapB(L, S) < 0.8 && onScr(S)) sayS(CT.stInPair, { a: nm(L), b: nm(S) }, 3, 0);
    else sayS(CT.stIn, { a: nm(L) }, 3, 0);
  });
  const leader0 = runners[st.lead];
  function battleOnly() {
    const tight = rem < 260 && gapB(L, S) < 0.8 && onScr(S);
    if (tight && raceT - st.battleT > 2.8) {
      st.battleT = raceT;
      if (gapB(L, T) < 0.8 && onScr(T)) sayS(CT.battle3, { a: nm(L), b: nm(S), c: nm(T) }, 3, 2);
      else sayS(CT.battle, { a: nm(L), b: nm(S) }, 3, 2);
    }
    return tight;
  }

  // --- 大逃げの独走：後続が画面に入るまでは一人旅 ---
  if (st.solo) {
    const comer = order.slice(1).find(r => onScr(r, 0.9));
    if (comer && rem < 380) {
      st.solo = false;
      const b = order.slice(1).find(r => onScr(r, 0.9) && fin(r) < 3) || comer;
      sayS(fin(L) === 0 ? CT.soloEndW : CT.soloEndL, { a: nm(L), b: nm(b) }, 3);
    } else if (raceT - st.soloT > 2.6 && !com.queue.length) {
      st.soloT = raceT;
      const chaser = order.slice(1).find(r => fin(r) < 3);     // 届きそうな馬にも触れる
      if (chaser && Math.random() < 0.4 && !com.said.has('sc' + chaser.i)) { com.said.add('sc' + chaser.i); sayS(CT.soloChase, { b: nm(chaser) }); }
      else sayS(fin(L) !== 0 && rem < 230 ? CT.soloFade : CT.solo, { a: nm(L), g: Math.round(gapB(L, S)) });   // 捕まる大逃げは後半トーンを落とす
    }
  }

  // --- 直線入口で先頭だった馬が失速(3着以内に残れない) ---
  if (rem < 25) { battleOnly(); return; }                  // ゴール寸前は叩き合いだけ
  if (!st.faded && L.i !== st.lead && fin(leader0) >= 3 && gapB(L, leader0) > 0.6 && onScr(leader0)) {
    st.faded = true; sayS(CT.fade, { a: nm(leader0) }, 3);
  } else if (!st.held && L.i !== st.lead && fin(leader0) < 3 && fin(leader0) > 0 && gapB(L, leader0) > 0.3 && onScr(leader0) && rem < 250 && rem > 50) {
    st.held = true; sayS(CT.hold, { a: nm(leader0) }, 2);
  }

  // --- 後ろから一気：画面の外にいた馬が、画面に入るかどうかの所まで来た(3着以内に来る馬だけ) ---
  if (rem < 340) for (const r of order) {
    const k = order.indexOf(r);
    if (k < 2 || fin(r) >= 3 || st.surged.has(r.i) || !st.out.has(r.i) || rem < (/直線一気/.test(r.o.style) ? 25 : 70)) continue;   // 直線一気はゴール直前に飛んでくることも
    const p = scr(r); if (!p || Math.abs(p.x) > (/直線一気/.test(r.o.style) ? 1.6 : 1.3)) continue;   // 直線一気は少し早めに呼ぶ
    st.surged.add(r.i); if (st.solo && fin(L) !== 0) st.solo = false;   // 一気の馬が来たら独走の実況はおしまい
    sayS(SUPER.has(r.o.style) && /直線一気|まくり/.test(r.o.style) ? CT.surgeSuper : LATE.test(r.o.style) ? CT.surge : CT.surgeOther, { a: nm(r) }, 4, 1.8);   // 一気の瞬間は最優先
    break;
  }

  // --- 先頭が入れ替わった ---
  if (L.i !== com.lastLeader && raceT - com.leadChgT > 2.5 && onScr(L)) { com.lastLeader = L.i; com.leadChgT = raceT; say1(CT.lead, { a: nm(L) }, 3); }

  // --- 残り200 ---
  if (rem < 230) once('r200', () => {
    const W = runners[planOrder[0]];
    if (W !== L && onScr(W) && gapB(L, W) < 4) sayS(CT.r200W, { a: nm(L), w: nm(W) }, 3);
    else if (gapB(L, S) >= 3) sayS(CT.r200S, { a: nm(L), g: Math.round(gapB(L, S)) }, 3);
    else { const b = order.slice(1).filter(r => onScr(r)).sort((x, y) => fin(x) - fin(y))[0] || S; sayS(CT.r200, { a: nm(L), b: nm(b) }, 3); }
  });

  // --- 1着争い(並んでいる間は何度でも) ---
  const tight = battleOnly();

  // --- 残り100 ---
  if (rem < 90) once('r100', () => {
    const W = runners[planOrder[0]];
    if (tight) sayS(CT.r100C, { a: nm(L), b: nm(S) }, 3, 1.5);
    else if (W !== L && onScr(W, 1.2)) sayS(CT.r100K, { a: nm(L), w: nm(W) }, 3, 1.5);      // 先頭はこのあと捕まる
    else if (W === L && gapB(L, S) >= 1.5) sayS(CT.r100A, { a: nm(L), g: Math.round(gapB(L, S)) }, 3, 1.5);
  });

  // --- つなぎ：映っている1〜3番手 / 3着以内に来る差し・追込(直線一気は「一気」の時だけ) ---
  if (!st.solo && !com.queue.length && com.shownT > 2.0 && raceT - st.fillT > 1.5 && rem > 60) {
    st.fillT = raceT;
    const opts = [];
    if (onScr(L)) opts.push(() => sayS(CT.leadF, { a: nm(L) }));
    for (const r of [S, T]) if (r && onScr(r) && gapB(L, r) < 4) opts.push(() => sayS(CT.chaseF, { a: nm(r) }));
    for (const r of order.slice(3)) if (fin(r) < 3 && LATE.test(r.o.style) && !/直線一気/.test(r.o.style) && onScr(r)) opts.push(() => sayS(CT.nobi, { a: nm(r) }), () => sayS(CT.nobi, { a: nm(r) }));
    if (opts.length) pk(opts)();
  }
}
function genCommentary(order) {
  const L = order[0], S = order[1], T = order[2], lead = L.trav, rem = D - lead, n = order.length;
  const g = Math.max(1, Math.round((lead - S.trav) / BASHIN));
  // 順位の履歴(進出・後退の判定用)
  if (state === 'race' && raceT - (com.histT || 0) > 1) { com.histT = raceT; (com.hist = com.hist || []).push(Object.fromEntries(order.map((r, k) => [r.i, k]))); if (com.hist.length > 6) com.hist.shift(); }
  if (state === 'race') {
    once('start', () => say1(CT.start, {}, 3));
    if (lead > 140) once('hana', () => {
      say1(CT.hana, { a: nm(L) }, 2);
      if (L.o.style === '超大逃げ') say1(CT.sooni, { a: nm(L) }, 2); else if (L.o.style === '大逃げ') say1(CT.ooni, { a: nm(L) }, 2);
    });
    if (lead > 300) once('2nd', () => say1(CT.second, { a: nm(S), b: nm(T) }));
    if (lead > 450 && !com.rank450) com.rank450 = Object.fromEntries(order.map((r, k) => [r.i, k]));
    if (lead > 520) once('gap', () => {
      const gg = Math.round((lead - order[n - 1].trav) / BASHIN);
      say(fill(pk(CT.gap), { g: gg }) + (gg > 25 ? '。' + pk(CT.gapLong) : gg < 10 ? '。' + pk(CT.gapShort) : ''));
    });
    if (rem < 800) once('r800', () => say1(CT.r800));
    if (rem < 600) once('r600', () => say1(CT.r600, {}, 2));
    if (com.rank450 && rem > 300) order.forEach((r, k) => {
      if (/まくり/.test(r.o.style) && com.rank450[r.i] - k >= 4) once('mk' + r.i, () => say1(r.o.style === '超まくり' ? CT.smakuri : CT.makuri, { a: nm(r) }, 2));
    });
    if (rem < 470) once('4c', () => say1(CT.c4, {}, 2));
    if (rem < 400) straightCommentary(order, rem, g);
    // 何も言うことがないときは、展開を拾ってしゃべる
    if (!com.queue.length && com.shownT > 2.0 && rem >= 400 && com.said.has('hana') && lead > 220) {
      const opts = [];
      if (rem >= 400) {
        opts.push(['leadNow', () => say1(CT.leadNow, { a: nm(L), g })], ['pair', () => say1(CT.pair, { a: nm(S), b: nm(T) })]);
        const m = order[Math.floor(n * 0.4 + Math.random() * n * 0.25)]; opts.push(['mid', () => say1(CT.mid, { a: nm(m) })]);
        const last = order[n - 1];
        opts.push(['rear', () => /追込|直線一気/.test(last.o.style) ? say1(CT.rearStyle, { a: nm(last), s: last.o.style }) : say1(CT.rear, { a: nm(last) })]);
        const fav = order.find(r => pop[r.i] === 1); if (fav) opts.push(['fav', () => say1(CT.favPos, { a: nm(fav), r: order.indexOf(fav) + 1 })]);
        opts.push(['pace', () => say1((lead - S.trav) / BASHIN > 6 || /大逃げ/.test(L.o.style) ? CT.pace : CT.slow)]);
        opts.push(['ground', () => say1(race.weather === '雨' ? CT.wet : race.surface === 'ダート' ? CT.dirt : CT.turf)]);
      }
      const h0 = com.hist && com.hist[0];
      if (h0) {
        let best = null, worst = null;
        order.forEach((r, k) => { const d = h0[r.i] - k; if (d >= 3 && (!best || d > best.d)) best = { r, d }; if (d <= -3 && (!worst || d < worst.d)) worst = { r, d }; });
        if (best) opts.push(['mover', () => say1(CT.mover, { a: nm(best.r) }, 2)], ['mover2', () => say1(CT.mover, { a: nm(best.r) }, 2)]);
        if (worst) opts.push(['fader', () => say1(CT.fader, { a: nm(worst.r) })]);
      }
      com.recent = com.recent || [];
      const cand = opts.filter(o => !com.recent.includes(o[0].replace('2', '')) && !(o[0] === 'ground' && com.said.has('ground')));
      const c = pk(cand.length ? cand : opts); const ty = c[0].replace('2', '');
      com.recent.push(ty); if (com.recent.length > 3) com.recent.shift();
      if (ty === 'ground') com.said.add('ground');       // 馬場の話は1レース1回
      c[1]();
    }
  }
  if (finish.length) once('win', () => {
    const w = finish[0], p = pop[w.i];
    const close = finish[1] && finish[1].ft - w.ft < 0.08;
    com.queue = [];                                     // 残りの実況は捨てて、勝ち馬だけ流して終わり
    // 勝ち方で言い回しを変える。「差し切り」は差し・追込の馬が直線で後ろから突っ込んで勝ったときだけ
    const ent = com.st && com.st.entry ? com.st.entry[w.i] : 0, ledIn = com.st && com.st.lead === w.i;
    const cameFrom = ent >= 2 || (com.st && com.st.surged.has(w.i));
    const wl = /差し|追込|直線一気/.test(w.o.style) && cameFrom ? (/追込|直線一気/.test(w.o.style) && ent >= 5 ? CT.winOikomi.concat(CT.winSashi) : CT.winSashi)
      : ledIn ? (/大逃げ/.test(w.o.style) ? CT.winOoni : /逃げ/.test(w.o.style) ? CT.winNige.concat(CT.winHold) : CT.winHold)
      : CT.win;
    let t = close ? fill(pk(CT.photo), { a: nm(w) }) : fill(pk(wl), { a: nm(w) });
    const mb = (race.margin || 0) * 17 / BASHIN;                         // 着差(馬身)のめやす
    if (mb >= 10) t += ' ' + pk(['とんでもない大差！', 'これは大差だ！後続は影も形も見えない！', '信じられない！何馬身ちぎったんだ！']);
    else if (mb >= 5) t += ' ' + pk(['ぶっちぎりの圧勝！', '後続を突き放して圧勝！', '強い！強すぎる！']);
    if (p === 1) t += ' ' + pk(CT.fav); else if (p >= 8) t += ' ' + fill(pk(['大波乱です！', '{p}番人気の大金星！']), { p });
    say(t, 5); com.shownT = 99; com.ended = true;
    const big = bigRank(), a = nm(w);
    const gl = RACE_LINES[race.name];
    if (gl) com.queue.push({ text: fill(pk(gl.post), { a: nm(w) }), prio: 5, mine: false });
  });
}

// ================= ループ =================
resetRace(); loadAll(); showStable(); bootAuth();
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const rdt = Math.min(clock.getDelta(), 0.05);
  const guest = isVsGuest() && ['count', 'race', 'done'].includes(state);
  if (state === 'count' && !guest) {
    countT -= rdt;
    center.textContent = '';
    if (countT <= 0) {
      state = 'race';
      for (const r of runners) r.v = cruise(r) * STYLE[r.o.style][0] * 0.98; // ゲートからいきなり巡航速度
      if (!race.online) drawOrder();                       // 人気(確率)に従って着順を抽選(対戦はホストが決めた着順)
 }
  }
  const steps = speed, dt = rdt;
  if (guest) { guestStep(rdt); updateGate(rdt * speed); }
  else { for (let i = 0; i < steps; i++) { simStep(dt); updateGate(dt); } sendRaceSnap(false); }
  const { order, lead } = updateCamera(rdt);
  updateRain(rdt); updateMarkers(clock.elapsedTime); updateCommentary(rdt, order);
  checkGateVisible();
  updateHUD(rdt, order, lead);
  if (race.online && betSheet.classList.contains('open')) { const t = document.getElementById('betTimer'); if (t) t.textContent = Math.max(0, Math.ceil((online.betEnd - Date.now()) / 1000)); }
  if (loginView) { updateLoginCam(rdt); renderer.render(scene, camera); }
  else if (trainOpen) { if (Math.abs(renderer.domElement.clientHeight - trainViewHeight()) > 2) refreshView(); updateTraining(rdt); renderer.render(trainObj.scene, trainObj.cam); }   // パネルの高さが後から確定しても映像をぴったり合わせる
  else if (stableOpen) { if (stableView === 'detail' && stableEl.classList.contains('half')) { updatePasture(rdt); renderer.render(pScene, pCam); } }
  else renderer.render(scene, camera);
}
loop();
</script>
